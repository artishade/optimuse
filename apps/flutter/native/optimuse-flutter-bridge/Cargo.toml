[package]
name = "optimuse-flutter-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
optimuse-core-application = { path = "../../../../core/crates/application/core" }
optimuse-proxy-local = { path = "../../../../core/crates/proxy/local" }
optimuse-host-api = { path = "../../../../core/crates/foundation/host-api" }
optimuse-link = { path = "../../../../core/crates/foundation/link" }
optimuse-runtime = { path = "../../../../core/crates/runtime/application", default-features = false, features = ["javascript"] }
optimuse-store = { path = "../../../../core/crates/persistence/store" }
optimuse-tools = { path = "../../../../core/crates/tool/services", default-features = false }
optimuse-util = { path = "../../../../core/crates/foundation/util" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
optimuse-host-native-common = { path = "../../../../hosts/common/optimuse-host-native-common" }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
optimuse-node-runtime = { path = "../../../../core/crates/node/runtime" }
optimuse-host-native-storage = { path = "../../../../hosts/common/optimuse-host-native-storage" }
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
mdns-sd = "0.12"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
optimuse-host-android-native = { path = "../../../../hosts/android" }

[target.'cfg(windows)'.dependencies]
optimuse-host-windows-native = { path = "../../../../hosts/windows" }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
optimuse-host-linux-native = { path = "../../../../hosts/linux" }

[target.'cfg(target_env = "ohos")'.dependencies]
optimuse-host-ohos-native = { path = "../../../../hosts/ohos" }

[target.'cfg(target_os = "ios")'.dependencies]
optimuse-host-ios-native = { path = "../../../../hosts/ios" }

[target.'cfg(target_os = "macos")'.dependencies]
optimuse-host-macos-native = { path = "../../../../hosts/macos" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
optimuse-host-web = { path = "../../../../hosts/web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tokio = { version = "1", default-features = false, features = ["macros", "sync"] }

[patch.crates-io]
quickjs-wasm-rs = { path = "../../../../core/vendor/quickjs-wasm-rs" }
