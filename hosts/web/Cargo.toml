[package]
name = "optimuse-host-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
js-sys = "0.3"
optimuse-host-api = { path = "../../core/crates/foundation/host-api" }
optimuse-proxy-local = { path = "../../core/crates/proxy/local" }
optimuse-runtime = { path = "../../core/crates/runtime/application", default-features = false }
quickjs-wasm-rs = "3.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "Event", "EventTarget", "MessageEvent", "Navigator", "WebSocket", "Window"] }
