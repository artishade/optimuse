[package]
name = "optimuse-host-android-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
libc = "0.2"
optimuse-host-api = { path = "../../core/crates/foundation/host-api" }
optimuse-host-native-common = { path = "../common/optimuse-host-native-common", default-features = false, features = ["tcp", "serial", "fs", "http", "scheduler", "storage"] }
optimuse-host-native-plugin-sdk-ipc = { path = "../common/optimuse-host-native-plugin-sdk-ipc" }
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
