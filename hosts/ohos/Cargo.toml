[package]
name = "optimuse-host-ohos-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
optimuse-host-api = { path = "../../core/crates/foundation/host-api" }
optimuse-host-native-common = { path = "../common/optimuse-host-native-common", default-features = false, features = ["tcp", "serial", "fs", "http", "scheduler", "storage", "terminal"] }
optimuse-local-models = { path = "../../core/crates/provider/local-model" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
uuid = { version = "1", features = ["v4"] }
