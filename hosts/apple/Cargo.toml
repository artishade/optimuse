[package]
name = "optimuse-host-apple-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
gethostname = "1.1"
globset = "0.4.18"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.26"
optimuse-host-api = { path = "../../core/crates/foundation/host-api" }
optimuse-host-native-common = { path = "../common/optimuse-host-native-common", default-features = false, features = ["http", "scheduler", "storage"] }
optimuse-host-native-plugin-sdk-ipc = { path = "../common/optimuse-host-native-plugin-sdk-ipc" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
optimuse-host-native-common = { path = "../common/optimuse-host-native-common", default-features = false, features = ["http", "scheduler", "terminal"] }
tungstenite = "0.24"
