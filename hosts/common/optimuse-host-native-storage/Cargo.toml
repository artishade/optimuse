[package]
name = "optimuse-host-native-storage"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
optimuse-host-api = { path = "../../../core/crates/foundation/host-api" }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
