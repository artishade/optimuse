[package]
name = "optimuse-runtime"
version = "2.0.0-preview.14"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["javascript"]
javascript = ["dep:optimuse-js-bridge", "optimuse-tools/javascript"]

[dependencies]
async-trait.workspace = true
aes = "0.8"
base64.workspace = true
chrono.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
json5.workspace = true
md-5 = "0.10"
optimuse-host-api = { path = "../../foundation/host-api" }
optimuse-route-macros = { path = "../../node/route-macros" }
optimuse-rslink-runtime = { path = "../../rslink/runtime" }
optimuse-link = { path = "../../foundation/link" }
optimuse-js-bridge = { path = "../../plugin/javascript-bridge", optional = true }
optimuse-local-models = { path = "../../provider/local-model" }
optimuse-model = { path = "../../foundation/model" }
optimuse-plugin-sdk = { path = "../../plugin/sdk" }
optimuse-providers = { path = "../../provider/services" }
optimuse-store = { path = "../../persistence/store" }
optimuse-tools = { path = "../../tool/services", default-features = false }
optimuse-util = { path = "../../foundation/util" }
reqwest.workspace = true
regex.workspace = true
rmp-serde = "1"
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
url = "2"
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
zip.workspace = true

[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_os = "android", target_os = "ios", target_env = "ohos"))))'.dependencies]
rquickjs.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "XmlHttpRequest"] }
