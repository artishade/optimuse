[package]
name = "optimuse-node-edge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Lightweight Edge Core node boundary for device apps."

[dependencies]
optimuse-node-runtime = { path = "../runtime", default-features = false }
async-trait.workspace = true
optimuse-host-api = { path = "../../foundation/host-api" }
optimuse-edge-contract = { path = "../edge-contract" }
optimuse-link = { path = "../../foundation/link" }
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
