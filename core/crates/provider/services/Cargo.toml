[package]
name = "optimuse-providers"
version = "2.0.0-preview.14"
edition.workspace = true
license.workspace = true
publish = true
description = "Provider contracts and built-in provider implementations for Optimuse."
readme = "README.md"
repository = "https://github.com/example/Optimuse"
documentation = "https://docs.rs/optimuse-providers"

