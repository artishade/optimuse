[package]
name = "optimuse-local-models"
version = "2.0.0-preview.14"
edition.workspace = true
license.workspace = true
publish = true
description = "Local model manifests, registry contracts, and inference session interfaces for Optimuse."
readme = "README.md"
repository = "https://github.com/example/Optimuse"
documentation = "https://docs.rs/optimuse-local-models"

[dependencies]
optimuse-host-api = { version = "0.1.0", path = "../../foundation/host-api" }
optimuse-util = { version = "2.0.0-preview.14", path = "../../foundation/util" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
bzip2-rs.workspace = true
tar.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
bzip2.workspace = true
