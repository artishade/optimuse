[package]
name = "optimuse-command-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
optimuse-runtime = { path = "../../runtime/application" }
optimuse-providers = { path = "../../provider/services" }
optimuse-store = { path = "../../persistence/store" }
optimuse-host-api = { path = "../../foundation/host-api" }
optimuse-local-models = { path = "../../provider/local-model" }
optimuse-model = { path = "../../foundation/model" }
optimuse-tools = { path = "../../tool/services" }
optimuse-util = { path = "../../foundation/util" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
optimuse-host-native-filesystem = { path = "../../../../hosts/common/optimuse-host-native-filesystem" }
optimuse-host-native-scheduler = { path = "../../../../hosts/common/optimuse-host-native-scheduler" }
optimuse-host-native-storage = { path = "../../../../hosts/common/optimuse-host-native-storage" }
