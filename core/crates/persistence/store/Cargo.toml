[package]
name = "optimuse-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = true
description = "Persistence stores, repositories, and synchronization primitives for Optimuse."
readme = "README.md"
repository = "https://github.com/example/Optimuse"
documentation = "https://docs.rs/optimuse-store"

[dependencies]
base64.workspace = true
chacha20poly1305 = "0.10"
chrono.workspace = true
getrandom = "0.2"
optimuse-host-api = { version = "0.1.0", path = "../../foundation/host-api" }
optimuse-model = { version = "2.0.0-preview.14", path = "../../foundation/model" }
optimuse-util = { version = "2.0.0-preview.14", path = "../../foundation/util" }
regex.workspace = true
jieba-rs = "=0.8.1"
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
optimuse-host-native-storage = { path = "../../../../hosts/common/optimuse-host-native-storage" }
rusqlite.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
