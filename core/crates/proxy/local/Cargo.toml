[package]
name = "optimuse-proxy-local"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
optimuse-node-runtime = { path = "../../node/runtime" }
optimuse-peer-link = { path = "../../node/peer-link" }
async-trait.workspace = true
optimuse-proxy-bridge = { path = "../bridge" }
optimuse-rslink-runtime = { path = "../../rslink/runtime" }
optimuse-host-api = { path = "../../foundation/host-api" }
optimuse-link = { path = "../../foundation/link" }
optimuse-local-models = { path = "../../provider/local-model" }
optimuse-model = { path = "../../foundation/model" }
optimuse-plugin-sdk = { path = "../../plugin/sdk" }
optimuse-plugin-sdk-ipc = { path = "../../plugin/sdk-ipc" }
optimuse-providers = { path = "../../provider/services" }
optimuse-runtime = { path = "../../runtime/application", default-features = false, features = ["javascript"] }
optimuse-store = { path = "../../persistence/store" }
optimuse-tools = { path = "../../tool/services", default-features = false }
optimuse-util = { path = "../../foundation/util" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }

[build-dependencies]
optimuse-proxy-scan = { path = "../scan" }
optimuse-proxy-dart-codegen = { path = "../dart-codegen" }
optimuse-proxy-rust-codegen = { path = "../rust-codegen" }
optimuse-plugin-sdk-codegen = { path = "../../plugin/codegen" }

[dev-dependencies]
optimuse-host-native-common = { path = "../../../../hosts/common/optimuse-host-native-common", default-features = false, features = ["fs", "http", "scheduler", "storage"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
optimuse-command-core = { path = "../../command/core" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
